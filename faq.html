<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FAQ — Harmony Music Academy</title>
  <meta name="description" content="Frequently asked questions about lessons, pricing, and learning at Harmony Music Academy." />
  <link rel="icon" href="assets/logo-icon.png" />
  <meta property="og:title" content="Harmony Music Academy" />
  <meta property="og:image" content="assets/logo.png" />
  <meta property="og:type" content="website" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400..600&family=Work+Sans:wght@400;500;600&family=Space+Grotesk:wght@400;500&display=swap" rel="stylesheet">

<body data-page="faq.html">

  <header class="site-header" id="site-header"></header>

  <main>
    <section class="page-hero">
      <span class="eyebrow">Common questions</span>
      <h1 style="margin-top:1rem;">FAQ</h1>
      <p class="lede">Everything you need to know about lessons, pricing, progress, and getting started at Harmony Music Academy. Can't find the answer? <a heref="mailto:harmonymusicacadamy@gmail.com"  style="color: var(--gold); text-decoration: underline;">Reach out to us</a>.</p>
    </section>

    <section class="section-pad" style="padding-top:0;">
      <div class="section-head reveal">
        <div>
          <span class="eyebrow">Questions &amp; Answers</span>
          <h2 style="margin-top:0.8rem;">Click any question to expand</h2>
        </div>
      </div>

      <!-- FAQ ACCORDION — Mount point for Google Sheet data -->
      <div class="faq-container reveal">
        <div id="faqAccordion">
          <!-- FAQ items loaded from Google Sheet -->
          <div class="skeleton"></div>
          <div class="skeleton"></div>
          <div class="skeleton"></div>
        </div>
      </div>
    </section>

    <div class="staff-divider" aria-hidden="true">
      <div class="lines"><span></span><span></span><span></span><span></span><span></span><div class="note" style="left:45%"></div></div>
    </div>

    <section class="section-pad">
      <div class="cta-band reveal">
        <div>
          <span class="eyebrow">Still have questions?</span>
          <h2 style="margin-top:0.8rem; font-size:clamp(1.6rem,3vw,2.2rem);">Get in touch with us.</h2>
        </div>
        <div class="hero-actions" style="margin-top:0;">
          <a href="mailto:harmonymusicacadamy@gmail.com" class="btn btn-primary">Send Email</a>
          <a href="" id="ctaPortalBtn" target="_blank" rel="noopener" class="btn btn-outline">Login as Student</a>
        </div>
      </div>
    </section>
  </main>

  <footer class="site-footer" id="site-footer"></footer>

  <script src="js/config.js"></script>
  <script src="js/sheets.js"></script>
  <script src="js/main.js"></script>
  <script src="js/faq.js"></script>
  <script>
    document.getElementById('ctaPortalBtn').href = SITE_CONFIG.STUDENT_PORTAL_URL;
  </script>

</html>
